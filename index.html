
<!doctype html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class of '09</title>
<meta name="theme-color" content="#000">

<link rel="icon" href="https://cdn.jsdelivr.net/gh/jc7041502-maker/C09@main/icons/icon-72x72.png">

<style>
html,body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:sans-serif;
}
#canvas {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
    border:0;
}
#presplash {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
}
.visible {
    visibility:visible;
    opacity:1;
    transition:opacity .1s linear;
}
.hidden {
    visibility:hidden;
    opacity:0;
    transition:visibility 0s .25s,opacity .25s linear;
}
#statusDiv,#inputDiv {
    position:absolute;
    top:0;
    left:0;
    right:0;
    width:50%;
    min-width:340px;
    margin:auto;
    padding:10px;
    background:rgba(0,0,0,.75);
    border-radius:0 0 5px 5px;
}
#statusTextDiv {
    max-height:40vh;
    overflow:auto;
    color:#ccc;
    font-size:14px;
}
#statusProgress {
    display:none;
    width:100%;
}
#inputDiv {
    width:65%;
    padding-left:10px;
    padding-right:20px;
}
#inputPrompt {
    color:#eee;
    font-size:150%;
    margin:1em 0;
}
#inputText {
    width:100%;
    padding:5px;
    font-size:175%;
    background:inherit;
    color:#eee;
}
#ContextContainer {
    position:absolute;
    top:0;
    left:0;
    color:white;
}
#ContextContainer.shown {
    background:rgba(0,0,0,.5);
    border-radius:0 0 5px 0;
}
#ContextButton {
    color:lightgrey;
    font-size:xx-large;
    padding:10px;
    cursor:pointer;
    text-decoration:none;
    user-select:none;
    opacity:.75;
}
#ContextMenu a {
    display:flex;
    align-items:center;
    justify-content:center;
    width:250px;
    height:48px;
    margin:5px;
    border:1px solid lightgrey;
    border-radius:5px;
    background:#444;
    color:lightgrey;
    text-decoration:none;
}
#ContextMenu a:hover {
    background:#666;
    color:white;
}
</style>
</head>

<body>

<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

<img id="presplash"
src="https://cdn.jsdelivr.net/gh/jc7041502-maker/C09@main/web-presplash.jpg">

<div id="ContextContainer">
    <a id="ContextButton">≡</a><br>
    <div id="ContextMenu" style="display:none">
        <input id="ID_SavegamesImport" type="file" accept="application/zip"
            onchange="onSavegamesImport(this)" style="display:none">
        <a href="javascript:document.getElementById('ID_SavegamesImport').click()">Import Saves</a>
        <a href="javascript:onSavegamesExport()">Export Saves</a>
        <a href="javascript:FSDownload('/log.txt','text/plain')">Download Log</a>
        <a href="https://www.renpy.org/" target="_blank">Powered by Ren'Py</a>
    </div>
</div>

<div id="statusDiv" class="hidden">
    <div id="statusTextDiv"></div>
    <progress id="statusProgress" max="100" value="0"></progress>
</div>

<div id="inputDiv" class="hidden">
    <form id="inputForm">
        <div id="inputPrompt"></div>
        <input id="inputText" type="text">
    </form>
</div>

<script>
(async function () {

    const CDN = "https://cdn.jsdelivr.net/gh/jc7041502-maker/C09@main/";

    const statusDiv = document.getElementById("statusDiv");
    const statusText = document.getElementById("statusTextDiv");

    function showError(error) {
        console.error(error);
        statusDiv.className = "visible";
        statusText.textContent = "Loading error: " + error.message;
    }

    function loadScript(src) {
        return new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = src;

            script.onload = resolve;

            script.onerror = () => reject(
                new Error("Could not load " + src)
            );

            document.body.appendChild(script);
        });
    }

    try {

        statusDiv.className = "visible";
        statusText.textContent = "Downloading game files...";

        const parts = [];

        for (const name of ["game.zip.part0", "game.zip.part1"]) {

            const response = await fetch(CDN + name);

            if (!response.ok) {
                throw new Error(name + " returned HTTP " + response.status);
            }

            parts.push(await response.arrayBuffer());
        }

        const gameBlob = new Blob(parts, {
            type: "application/zip"
        });

        window.gameZipURL = URL.createObjectURL(gameBlob);

        window.Module = {
            locateFile: function (path) {
                return CDN + path;
            }
        };

        statusText.textContent = "Starting Ren'Py...";

        await loadScript(CDN + "renpy-pre.js");
        await loadScript(CDN + "renpy.js");

    } catch (error) {
        showError(error);
    }

})();
</script>

</body>
</html>
