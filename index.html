
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class of '09</title>

<link rel="icon" href="https://raw.githubusercontent.com/jc7041502-maker/C09/main/icons/icon-72x72.png">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#gameContainer {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
}

#canvas {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    outline: none;
}

#presplash {
    position: absolute;
    inset: 0;
    z-index: 5;
    background: #000 url("https://raw.githubusercontent.com/jc7041502-maker/C09/main/web-presplash.jpg") center center / contain no-repeat;
}

#overlayDiv {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: transparent;
    cursor: default;
}

#ContextContainer {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 20;
}

#ContextButton {
    border: 1px solid #555;
    background: rgba(20, 20, 20, 0.9);
    color: white;
    padding: 9px 13px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
}

#ContextMenu {
    display: none;
    position: absolute;
    right: 0;
    top: 42px;
    min-width: 170px;
    padding: 6px;
    background: #171717;
    border: 1px solid #444;
    border-radius: 8px;
}

#ContextMenu a {
    display: block;
    padding: 10px;
    color: white;
    text-decoration: none;
    border-radius: 5px;
    font-size: 13px;
    cursor: pointer;
}

#ContextMenu a:hover {
    background: #333;
}

#statusDiv {
    position: absolute;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%);
    width: min(500px, 90%);
    padding: 14px;
    background: rgba(15, 15, 15, 0.95);
    border: 1px solid #444;
    border-radius: 9px;
    color: white;
    z-index: 30;
    font-size: 13px;
}

#statusDiv.hidden {
    display: none;
}

#statusDiv.visible {
    display: block;
}

#statusTextDiv {
    max-height: 100px;
    overflow-y: auto;
    margin-bottom: 8px;
}

#statusProgress {
    width: 100%;
    height: 7px;
    accent-color: #fff;
}

#inputDiv {
    display: none;
    position: absolute;
    z-index: 40;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(400px, 90%);
    padding: 18px;
    background: #171717;
    border: 1px solid #555;
    border-radius: 9px;
    color: white;
}

#inputDiv.visible {
    display: block;
}

#inputDiv.hidden {
    display: none;
}

#inputPrompt {
    margin-bottom: 12px;
}

#inputText {
    width: 100%;
    padding: 10px;
    border: 1px solid #555;
    border-radius: 5px;
    background: #080808;
    color: white;
    outline: none;
}

#inputForm button {
    margin-top: 10px;
    padding: 8px 14px;
    border: 0;
    border-radius: 5px;
    background: #eee;
    color: #111;
    cursor: pointer;
}

#errorBox {
    display: none;
    position: absolute;
    z-index: 100;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(550px, 90%);
    padding: 20px;
    background: #171717;
    border: 1px solid #8b3333;
    border-radius: 10px;
    color: white;
    text-align: center;
}

#errorBox h2 {
    margin-top: 0;
    color: #ff7777;
}

#errorMessage {
    overflow-wrap: anywhere;
    color: #ccc;
    font-size: 13px;
    line-height: 1.5;
}

#errorBox button {
    margin-top: 12px;
    padding: 10px 16px;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
}

</style>
</head>

<body>

<div id="gameContainer">

    <canvas id="canvas" tabindex="0"></canvas>

    <div id="presplash"></div>

    <!-- Required by renpy-pre.js -->
    <div id="overlayDiv"></div>

    <div id="ContextContainer">
        <button id="ContextButton" type="button">Menu</button>

        <div id="ContextMenu">
            <a href="#" onclick="setFullscreen(true); return false;">Fullscreen</a>
            <a href="#" onclick="setFullscreen(false); return false;">Exit fullscreen</a>
            <a href="#" onclick="location.reload(); return false;">Restart game</a>
        </div>
    </div>

    <div id="statusDiv" class="visible">
        <div id="statusTextDiv">Preparing game...</div>
        <progress id="statusProgress" value="0" max="100"></progress>
    </div>

    <div id="inputDiv" class="hidden">
        <form id="inputForm">
            <div id="inputPrompt"></div>
            <input id="inputText" type="text" autocomplete="off">
            <button type="submit">Submit</button>
        </form>
    </div>

    <div id="errorBox">
        <h2>Game couldn't load</h2>
        <div id="errorMessage"></div>
        <button onclick="location.reload()">Try again</button>
    </div>

</div>

<script>
const RAW_BASE =
    "https://raw.githubusercontent.com/jc7041502-maker/C09/main/";

const CDN_BASE =
    "https://cdn.jsdelivr.net/gh/jc7041502-maker/C09@main/";

function showError(message) {
    document.getElementById("errorBox").style.display = "block";
    document.getElementById("errorMessage").textContent = message;

    document.getElementById("statusDiv").classList.add("hidden");

    console.error(message);
}

function loadScript(url) {
    return new Promise((resolve, reject) => {
        const script = document.createElement("script");

        script.src = url;
        script.onload = resolve;
        script.onerror = () => reject(
            new Error("Could not load script: " + url)
        );

        document.head.appendChild(script);
    });
}

async function startGame() {
    try {
        const partNames = [
            "game.zip.part0",
            "game.zip.part1"
        ];

        const zipParts = [];

        for (let i = 0; i < partNames.length; i++) {
            const filename = partNames[i];

            document.getElementById("statusTextDiv").textContent =
                "Downloading game files (" + (i + 1) + "/" + partNames.length + ")...";

            const response = await fetch(RAW_BASE + filename);

            if (!response.ok) {
                throw new Error(
                    "Couldn't download " + filename +
                    ". Server returned " + response.status
                );
            }

            zipParts.push(await response.arrayBuffer());
        }

        document.getElementById("statusTextDiv").textContent =
            "Preparing game data...";

        const gameBlob = new Blob(zipParts, {
            type: "application/zip"
        });

        window.gameZipURL = URL.createObjectURL(gameBlob);

        // Configure Emscripten before loading Ren'Py.
        window.Module = {
            locateFile: function(path, prefix) {
                const filename = path.split("/").pop();

                if (
                    filename === "renpy.wasm" ||
                    filename === "renpy.data"
                ) {
                    return RAW_BASE + filename;
                }

                return prefix + path;
            }
        };

        document.getElementById("statusTextDiv").textContent =
            "Starting Ren'Py engine...";

        await loadScript(CDN_BASE + "renpy-pre.js");
        await loadScript(CDN_BASE + "renpy.js");

    } catch (error) {
        showError(error.message || String(error));
    }
}

startGame();
</script>

</body>
</html>
